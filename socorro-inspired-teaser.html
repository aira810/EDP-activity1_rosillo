<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socorro 3D — Events Teaser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: system-ui, sans-serif; background: #0a1628; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      color: #a8d4f0; background: rgba(10, 22, 40, 0.88);
      padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(125, 211, 252, 0.25);
      font-size: 13px; line-height: 1.55; max-width: 300px;
    }
    #hud strong { color: #fff; display: block; margin-bottom: 4px; font-size: 14px; }
    #hud em { color: #7dd3fc; font-style: normal; font-size: 12px; }
  </style>
</head>
<body>
  <div id="hud">
    <strong>Socorro 3D — Events Teaser</strong>
    Click a building to select it.<br>
    Hover to preview — same events as your 2D lab.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    const hud = document.getElementById('hud');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1628);
    scene.fog = new THREE.Fog(0x0a1628, 35, 100);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 200);
    camera.position.set(14, 16, 20);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xfff0d0, 1.5);
    sun.position.set(12, 22, 10);
    sun.castShadow = true;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x406080, 0.55));

    const island = new THREE.Mesh(
      new THREE.CylinderGeometry(18, 20, 1.2, 32),
      new THREE.MeshStandardMaterial({ color: 0x2d6a3e, roughness: 0.92 })
    );
    island.position.y = -0.6;
    island.receiveShadow = true;
    scene.add(island);

    const water = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x143d5c, roughness: 0.35, metalness: 0.15 })
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = -0.8;
    scene.add(water);

    const buildings = [];
    const spots = [
      { name: 'Town Hall', color: 0xe8dcc8, x: -5, z: 3, w: 4, h: 4, d: 3 },
      { name: 'Church', color: 0xd4c4a8, x: 2, z: 1, w: 3.5, h: 6, d: 3.5 },
      { name: 'Market', color: 0xc8b090, x: 6, z: 4, w: 3, h: 3, d: 4 },
      { name: 'Pier', color: 0x8a7858, x: -3, z: -5, w: 5, h: 1.5, d: 2 },
      { name: 'School', color: 0xf0e8d8, x: -1, z: 6, w: 4, h: 3.5, d: 3 },
    ];

    spots.forEach((spot) => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(spot.w, spot.h, spot.d),
        new THREE.MeshStandardMaterial({ color: spot.color, roughness: 0.88 })
      );
      mesh.position.set(spot.x, spot.h / 2, spot.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { isBuilding: true, name: spot.name, baseColor: spot.color };
      scene.add(mesh);
      buildings.push(mesh);
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-9999, -9999);
    let selected = null;
    let hovered = null;

    function paintBuilding(mesh, color) {
      mesh.material.color.setHex(color);
    }

    function resetHud() {
      hud.innerHTML = '<strong>Socorro 3D — Events Teaser</strong>Click a building to select it.<br>Hover to preview — same events as your 2D lab.';
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function onClick() {
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(buildings, false);

      if (selected) paintBuilding(selected, selected.userData.baseColor);

      selected = hits.length ? hits[0].object : null;

      if (selected) {
        paintBuilding(selected, 0xf472b6);
        hud.innerHTML = '<strong>Selected: ' + selected.userData.name + '</strong><em>click → addEventListener → handler → 3D response</em>';
      } else {
        resetHud();
      }
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('mousemove', onMouseMove);
    renderer.domElement.addEventListener('click', onClick);

    function animate() {
      requestAnimationFrame(animate);

      raycaster.setFromCamera(mouse, camera);
      const hoverHits = raycaster.intersectObjects(buildings, false);
      const nextHovered = hoverHits.length ? hoverHits[0].object : null;

      if (hovered && hovered !== selected) paintBuilding(hovered, hovered.userData.baseColor);
      hovered = nextHovered;
      if (hovered && hovered !== selected) paintBuilding(hovered, 0x7dd3fc);

      renderer.domElement.style.cursor = hovered ? 'pointer' : 'default';

      const t = Date.now() * 0.00025;
      camera.position.x = 14 + Math.sin(t) * 3;
      camera.position.z = 20 + Math.cos(t) * 2;
      camera.lookAt(0, 2, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
